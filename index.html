<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity Web Player | word-chef</title>
  </head>
  <style>
    html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: black;
    }

    #unity-container {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
    }

    #unity-canvas {
        width: 100%;
        height: 100%;
        display: block;
        background: black;
        image-rendering: auto; /* optional, prevents pixelation scaling */
    }

    /* Rotate warning overlay */
    #rotate-warning {
        position: fixed;
        inset: 0;
        background: black;
        color: white;
        display: none;
        justify-content: center;
        align-items: center;
        text-align: center;
        font-size: 24px;
        z-index: 9999;
    }
  </style>
  <body style="text-align: center; padding: 0; border: 0; margin: 0;">
    <canvas id="unity-canvas" width=960 height=600 tabindex="-1" style="width: 960px; height: 600px; background: #231F20"></canvas>
    
    <div id="rotate-warning">
      <div>
          🔄 Please rotate your device<br/>
          <small>Landscape mode required</small>
      </div>
    </div>

    <script>
        function isMobile() {
            return /Android|iPhone|iPad|iPod|Opera Mini|IEMobile|WPDesktop/i.test(navigator.userAgent);
        }
    </script>

    <script>
      function checkOrientation() {
          const isPortrait = window.matchMedia("(orientation: portrait)").matches;
          const warning = document.getElementById("rotate-warning");

          if (isPortrait) {
              warning.style.display = "flex";
          } else {
              warning.style.display = "none";
          }
      }

      checkOrientation();

      window.addEventListener("resize", checkOrientation);
      window.addEventListener("orientationchange", checkOrientation);
    </script>

    <script>
        function tryLockLandscape() {
            try {
                if (screen.orientation && screen.orientation.lock) {
                    screen.orientation.lock("landscape").catch(() => {});
                }
            } catch {}
        }

        function requestFullscreen() {
            try {
                const el = document.documentElement;
                if (el.requestFullscreen) el.requestFullscreen();
                else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
                else if (el.msRequestFullscreen) el.msRequestFullscreen();
            } catch {}
        }

        function enterImmersiveMode() {
            if (!isMobile()) return; // only on mobile

            requestFullscreen();
            tryLockLandscape();
        }
    </script>

    <script>
        window.SetFullscreenFromUnity = function () {
            requestFullscreen();
        }
    </script>
    
    <script src="Build/wordcheftest.loader.js"></script>

    <script>
        let unityInstance = null;
        let unityReady = false;

        // Wait for the loader to exist
        function onUnityLoaderReady() {
            unityReady = true;
        }

        if (document.readyState === "complete") {
            onUnityLoaderReady();
        } else {
            window.addEventListener("load", onUnityLoaderReady);
        }

        function startUnity() {
            if (!unityReady || unityInstance) return;

            enterImmersiveMode();

            const canvas = document.querySelector("#unity-canvas");

            createUnityInstance(canvas, {
                dataUrl: "Build/wordcheftest.data",
                frameworkUrl: "Build/wordcheftest.framework.js",
                codeUrl: "Build/wordcheftest.wasm",
                streamingAssetsUrl: "StreamingAssets",
                companyName: "DPoli",
                productName: "word-chef",
                productVersion: "1.0",
            }).then(instance => {
                unityInstance = instance;
                resizeUnityCanvas(); // scale internal buffer after load
            }).catch(err => {
                console.error("Unity failed to start:", err);
            });
        }

        // --- Wait for the loader to finish loading ---
        function onLoaderReady() {
            if (isMobile()) {
                // Mobile: wait for user gesture
                document.addEventListener("click", startUnity, { once: true });
                document.addEventListener("touchstart", startUnity, { once: true });
            } else {
                // Desktop: start immediately, but after loader is loaded
                startUnity();
            }
        }

        // Call after window load
        if (document.readyState === "complete") {
            onLoaderReady();
        } else {
            window.addEventListener("load", onLoaderReady);
        }

        // --- Canvas scaling ---
        function resizeUnityCanvas() {
            const canvas = document.getElementById("unity-canvas");
            const targetAspect = 960 / 600; // Unity design aspect ratio

            const w = window.innerWidth;
            const h = window.innerHeight;

            let newWidth, newHeight;

            if (w / h > targetAspect) {
                newHeight = h;
                newWidth = h * targetAspect;
            } else {
                newWidth = w;
                newHeight = w / targetAspect;
            }

            // Update CSS size
            canvas.style.width = newWidth + "px";
            canvas.style.height = newHeight + "px";
            canvas.style.marginLeft = ((w - newWidth) / 2) + "px";
            canvas.style.marginTop = ((h - newHeight) / 2) + "px";

            // Update Unity internal buffer only if instance exists
            if (unityInstance && unityInstance.Module && unityInstance.Module.canvas) {
                const dpi = window.devicePixelRatio || 1;
                const ctx = unityInstance.Module.canvas.getContext('webgl2') || unityInstance.Module.canvas.getContext('webgl');
                if (ctx) {
                    unityInstance.Module.canvas.width = newWidth * dpi;
                    unityInstance.Module.canvas.height = newHeight * dpi;
                    ctx.viewport(0, 0, newWidth * dpi, newHeight * dpi);
                }
            }
        }

        // Always call to set initial canvas size (CSS)
        window.addEventListener("resize", resizeUnityCanvas);
        window.addEventListener("orientationchange", resizeUnityCanvas);
        resizeUnityCanvas();
    </script>
  </body>
</html>
