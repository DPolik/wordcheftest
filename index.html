<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity Web Player | word-chef</title>
  </head>
  <style>
    /* Rotate warning overlay */
    #rotate-warning {
        position: fixed;
        inset: 0;
        background: black;
        color: white;
        display: none;
        justify-content: center;
        align-items: center;
        text-align: center;
        font-size: 24px;
        z-index: 9999;
    }
  </style>
  <body style="text-align: center; padding: 0; border: 0; margin: 0;">
    <canvas id="unity-canvas" width=960 height=600 tabindex="-1" style="width: 960px; height: 600px; background: #231F20"></canvas>
    
    <div id="rotate-warning">
      <div>
          🔄 Please rotate your device<br/>
          <small>Landscape mode required</small>
      </div>
    </div>

    <script>
      function checkOrientation() {
          const isPortrait = window.matchMedia("(orientation: portrait)").matches;
          const warning = document.getElementById("rotate-warning");

          if (isPortrait) {
              warning.style.display = "flex";
          } else {
              warning.style.display = "none";
          }
      }

      checkOrientation();

      window.addEventListener("resize", checkOrientation);
      window.addEventListener("orientationchange", checkOrientation);
    </script>

    <script>
        function tryLockLandscape() {
            try {
                if (screen.orientation && screen.orientation.lock) {
                    screen.orientation.lock("landscape").catch(() => {});
                }
            } catch {}
        }

        function requestFullscreen() {
            try {
                const el = document.documentElement;
                if (el.requestFullscreen) el.requestFullscreen();
                else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
                else if (el.msRequestFullscreen) el.msRequestFullscreen();
            } catch {}
        }

        function enterImmersiveMode() {
            requestFullscreen();
            tryLockLandscape();
        }
    </script>

    <script>
        window.SetFullscreenFromUnity = function () {
            requestFullscreen();
        }
    </script>
    
    <script src="Build/wordcheftest.loader.js"></script>

    <script>
        let unityInstance = null;
        let unityReady = false;

        // Wait for the loader to exist
        function onUnityLoaderReady() {
            unityReady = true;
        }

        if (document.readyState === "complete") {
            onUnityLoaderReady();
        } else {
            window.addEventListener("load", onUnityLoaderReady);
        }

        function startUnity() {
            if (!unityReady || unityInstance) return;

            enterImmersiveMode();

            const canvas = document.querySelector("#unity-canvas");

            createUnityInstance(canvas, {
                dataUrl: "Build/wordcheftest.data",
                frameworkUrl: "Build/wordcheftest.framework.js",
                codeUrl: "Build/wordcheftest.wasm",
                streamingAssetsUrl: "StreamingAssets",
                companyName: "DPoli",
                productName: "word-chef",
                productVersion: "1.0",
            }).then(instance => {
                unityInstance = instance;
            }).catch(err => {
                console.error("Unity failed to start:", err);
            });
        }

        document.addEventListener("click", startUnity, { once: true });
        document.addEventListener("touchstart", startUnity, { once: true });
    </script>
  </body>
</html>
