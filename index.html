<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity Web Player | word-chef</title>
  </head>
  <style>
    /* Rotate warning overlay */
    #rotate-warning {
        position: fixed;
        inset: 0;
        background: black;
        color: white;
        display: none;
        justify-content: center;
        align-items: center;
        text-align: center;
        font-size: 24px;
        z-index: 9999;
    }
  </style>
  <body style="text-align: center; padding: 0; border: 0; margin: 0;">
    <canvas id="unity-canvas" width=960 height=600 tabindex="-1" style="width: 960px; height: 600px; background: #231F20"></canvas>
    
    <div id="rotate-warning">
      <div>
          🔄 Please rotate your device<br/>
          <small>Landscape mode required</small>
      </div>
    </div>

    <script>
      function checkOrientation() {
          const isPortrait = window.matchMedia("(orientation: portrait)").matches;
          const warning = document.getElementById("rotate-warning");

          if (isPortrait) {
              warning.style.display = "flex";
          } else {
              warning.style.display = "none";
          }
      }

      checkOrientation();

      window.addEventListener("resize", checkOrientation);
      window.addEventListener("orientationchange", checkOrientation);

      async function lockLandscape() {
          if (screen.orientation && screen.orientation.lock) {
              try {
                  await screen.orientation.lock("landscape");
              } catch (e) {}
          }
      }

      document.addEventListener("click", lockLandscape, { once: true });
      document.addEventListener("touchstart", lockLandscape, { once: true });
    </script>
    
    <script src="Build/test2.loader.js"></script>
    <script>
      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        // Mobile device style: fill the whole browser client area with the game canvas:
        var meta = document.createElement('meta');
        meta.name = 'viewport';
        meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
        document.getElementsByTagName('head')[0].appendChild(meta);

        var canvas = document.querySelector("#unity-canvas");
        canvas.style.width = "100%";
        canvas.style.height = "100%";
        canvas.style.position = "fixed";

        document.body.style.textAlign = "left";

      }

      createUnityInstance(document.querySelector("#unity-canvas"), {
        arguments: [],
        dataUrl: "Build/test2.data",
        frameworkUrl: "Build/test2.framework.js",
        codeUrl: "Build/test2.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DPoli",
        productName: "word-chef",
        productVersion: "1.0",
        // matchWebGLToCanvasSize: false, // Uncomment this to separately control WebGL canvas render size and DOM element size.
        // devicePixelRatio: 1, // Uncomment this to override low DPI rendering on high DPI displays.
      }).then((unityInstance) => {
      }).catch((message) => {
        alert(message);
      });
    </script>
  </body>
</html>
